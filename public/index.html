<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Task Manager — MongoDB</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    body { background: #f3f5fb; color: #20243a; padding: 24px 16px; }
    .app { max-width: 820px; margin: 0 auto; background: #fff; padding: 28px; border-radius: 16px; box-shadow: 0 5px 25px rgba(0,0,0,.07); }
    header { text-align: center; margin-bottom: 24px; }
    header h1 { color: #5145cd; font-size: 30px; }
    header p { color: #777; font-size: 13px; margin-top: 5px; }
    .error { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 13px; display: none; }
    .error.show { display: block; }
    .form-wrapper { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .form-row { display: flex; gap: 10px; flex-wrap: wrap; }
    input, select { flex: 1; padding: 11px 14px; border: 1.5px solid #d1d5db; border-radius: 8px; font-size: 14px; outline: none; background: #fafafa; }
    input:focus, select:focus { border-color: #5145cd; box-shadow: 0 0 0 3px rgba(81,69,205,.12); background: #fff; }
    .desc-input { width: 100%; }
    button { padding: 11px 18px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; }
    .btn-add { background: #5145cd; color: white; white-space: nowrap; }
    .btn-add:hover { background: #3d33a0; }
    .filter-bar { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .filter-btn { background: #f0efff; color: #5145cd; padding: 7px 16px; font-size: 13px; }
    .filter-btn.active { background: #5145cd; color: white; }
    .info { text-align: center; color: #6b7280; padding: 20px; font-style: italic; }
    .task-list { display: flex; flex-direction: column; gap: 12px; }
    .task { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; padding: 16px; border: 1.5px solid #e5e5ef; border-radius: 10px; }
    .task:hover { box-shadow: 0 2px 8px rgba(0,0,0,.06); }
    .task-info { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 0; word-break: break-word; }
    .task-info strong { font-size: 15px; color: #111827; }
    .task-info .desc { font-size: 13px; color: #6b7280; }
    .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; align-items: center; }
    .badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; }
    .pending { background: #fef9c3; color: #854d0e; }
    .ongoing { background: #dbeafe; color: #1e40af; }
    .completed { background: #dcfce7; color: #166534; }
    .low { background: #d1fae5; color: #065f46; }
    .medium { background: #fef3c7; color: #92400e; }
    .high { background: #fee2e2; color: #991b1b; }
    .date { background: #f3f4f6; color: #6b7280; font-size: 11px; padding: 2px 8px; border-radius: 10px; }
    .actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .actions select { font-size: 12px; padding: 6px 10px; background: #f0efff; color: #5145cd; font-weight: 600; flex: none; }
    .btn-del { background: #fff0f0; color: #dc2626; font-size: 16px; padding: 8px 10px; }
    .btn-del:hover { background: #fee2e2; }
    .db-banner { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; padding: 10px 14px; font-size: 12px; color: #166534; margin-bottom: 18px; display: flex; justify-content: space-between; align-items: center; }
    @media(max-width:600px) { .task { flex-direction: column; } .actions { width: 100%; justify-content: flex-end; } }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>📋 Project Task Manager</h1>
      <p>Powered by Node.js, Express & MongoDB Database</p>
    </header>

    <div class="db-banner">
      <span>🍃 <strong>MongoDB Status:</strong> <span id="dbStatus">Checking...</span></span>
      <span id="dbName" style="font-size:11px;color:#166534;"></span>
    </div>

    <div id="errorBox" class="error"></div>

    <div class="form-wrapper">
      <div class="form-row">
        <input id="taskTitle" type="text" placeholder="Task title (required)" required />
        <select id="taskPriority">
          <option value="Low">🟢 Low Priority</option>
          <option value="Medium" selected>🟡 Medium Priority</option>
          <option value="High">🔴 High Priority</option>
        </select>
        <button class="btn-add" onclick="addTask()">+ Add Task</button>
      </div>
      <input id="taskDesc" type="text" placeholder="Description (optional)" class="desc-input" />
    </div>

    <div class="filter-bar">
      <button class="filter-btn active" data-filter="All" onclick="setFilter(this,'All')">All</button>
      <button class="filter-btn" data-filter="Pending" onclick="setFilter(this,'Pending')">Pending</button>
      <button class="filter-btn" data-filter="Ongoing" onclick="setFilter(this,'Ongoing')">Ongoing</button>
      <button class="filter-btn" data-filter="Completed" onclick="setFilter(this,'Completed')">Completed</button>
    </div>

    <div id="count" style="font-size:14px;color:#374151;font-weight:600;margin-bottom:12px;"></div>
    <div id="taskList" class="task-list">
      <p class="info">Loading tasks from MongoDB...</p>
    </div>
  </div>

  <script>
    const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    const API = isLocal ? 'http://localhost:5000/tasks' : '/tasks';
    let currentFilter = 'All';
    let allTasks = [];

    // Check health / DB status
    async function checkHealth() {
      try {
        const url = isLocal ? 'http://localhost:5000/api/health' : '/api/health';
        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) throw new Error();
        const data = await res.json();
        document.getElementById('dbStatus').innerText = data.database || 'Connected';
        document.getElementById('dbName').innerText = 'DB: ' + (data.dbName || 'taskmanager');
      } catch {
        document.getElementById('dbStatus').innerText = 'Using local cache (run node server.js for MongoDB)';
        document.getElementById('dbStatus').style.color = '#92400e';
      }
    }

    function showError(msg) {
      const el = document.getElementById('errorBox');
      el.innerText = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 5000);
    }

    function getCache() {
      try { return JSON.parse(localStorage.getItem('pm_tasks') || '[]'); } catch { return []; }
    }

    function saveCache(tasks) {
      localStorage.setItem('pm_tasks', JSON.stringify(tasks));
    }

    function escHtml(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function renderTasks() {
      const listEl = document.getElementById('taskList');
      const countEl = document.getElementById('count');
      let tasks = allTasks;
      if (currentFilter !== 'All') tasks = tasks.filter(t => t.status === currentFilter);
      countEl.innerText = tasks.length ? `Tasks (${tasks.length})` : '';

      if (tasks.length === 0) {
        listEl.innerHTML = '<p class="info">No tasks found. Add your first task above!</p>';
        return;
      }

      listEl.innerHTML = tasks.map(task => `
        <div class="task" id="task-${task._id}">
          <div class="task-info">
            <strong>${escHtml(task.title)}</strong>
            ${task.description ? `<span class="desc">${escHtml(task.description)}</span>` : ''}
            <div class="meta">
              <span class="badge ${(task.priority||'Medium').toLowerCase()}">${task.priority || 'Medium'}</span>
              <span class="badge ${(task.status||'Pending').toLowerCase()}">${task.status}</span>
              <span class="date">${new Date(task.createdAt).toLocaleDateString()}</span>
            </div>
          </div>
          <div class="actions">
            <select onchange="updateStatus('${task._id}', this.value)">
              <option value="Pending" ${task.status==='Pending'?'selected':''}>Pending</option>
              <option value="Ongoing" ${task.status==='Ongoing'?'selected':''}>Ongoing</option>
              <option value="Completed" ${task.status==='Completed'?'selected':''}>Completed</option>
            </select>
            <button class="btn-del" onclick="deleteTask('${task._id}')" title="Delete Task">🗑️</button>
          </div>
        </div>
      `).join('');
    }

    async function loadTasks() {
      try {
        const url = currentFilter !== 'All' ? `${API}?status=${currentFilter}` : API;
        const res = await fetch(url, { cache: 'no-store' });
        if (res.ok) {
          allTasks = await res.json();
          saveCache(allTasks);
        } else { throw new Error(); }
      } catch {
        allTasks = getCache();
        if (allTasks.length === 0) {
          document.getElementById('taskList').innerHTML = '<p class="info">Start the backend (node server.js) to load from MongoDB.</p>';
          return;
        }
      }
      renderTasks();
    }

    function setFilter(btn, f) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = f;
      renderTasks();
    }

    async function addTask() {
      const title = document.getElementById('taskTitle').value.trim();
      const description = document.getElementById('taskDesc').value.trim();
      const priority = document.getElementById('taskPriority').value;
      if (!title) { showError('Task title is required!'); return; }

      try {
        const res = await fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, description, priority })
        });
        if (!res.ok) throw new Error();
        const newTask = await res.json();
        allTasks.unshift(newTask);
        saveCache(allTasks);
      } catch {
        // Offline fallback - save to local cache
        const cached = { _id: 'local-' + Date.now(), title, description, priority, status: 'Pending', createdAt: new Date().toISOString() };
        allTasks.unshift(cached);
        saveCache(allTasks);
        showError('⚠️ Saved locally (start node server.js to save to MongoDB)');
      }

      document.getElementById('taskTitle').value = '';
      document.getElementById('taskDesc').value = '';
      renderTasks();
    }

    async function updateStatus(id, status) {
      try {
        const res = await fetch(`${API}/${id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status })
        });
        if (res.ok) {
          const updated = await res.json();
          allTasks = allTasks.map(t => t._id === id ? updated : t);
        } else {
          allTasks = allTasks.map(t => t._id === id ? { ...t, status } : t);
        }
      } catch {
        allTasks = allTasks.map(t => t._id === id ? { ...t, status } : t);
      }
      saveCache(allTasks);
      renderTasks();
    }

    async function deleteTask(id) {
      if (!confirm('Delete this task?')) return;
      try {
        await fetch(`${API}/${id}`, { method: 'DELETE' });
      } catch {}
      allTasks = allTasks.filter(t => t._id !== id);
      saveCache(allTasks);
      renderTasks();
    }

    // Handle Enter key on input
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.target.id === 'taskTitle') addTask();
    });

    checkHealth();
    loadTasks();
  </script>
</body>
</html>
